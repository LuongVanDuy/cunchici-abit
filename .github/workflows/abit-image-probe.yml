name: Abit Image Probe

on:
  pull_request:
    paths:
      - '.github/abit-image-probe-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  ABIT_BASE_URL: https://new.abitstore.vn
  ABIT_PARTNER_NAME: tac989

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe Abit image CDN and descriptions
        env:
          ABIT_ACCESS_TOKEN: ${{ secrets.ABIT_ACCESS_TOKEN }}
        run: |
          if [ -z "$ABIT_ACCESS_TOKEN" ]; then
            echo "Missing repository secret ABIT_ACCESS_TOKEN" >&2
            exit 1
          fi
          echo "::add-mask::$ABIT_ACCESS_TOKEN"
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          endpoint = os.environ['ABIT_BASE_URL'].rstrip('/') + '/products/listProductsforPartner'
          token = os.environ['ABIT_ACCESS_TOKEN']
          partner = os.environ['ABIT_PARTNER_NAME']

          def post(page, limit=100):
              payload = {
                  'access_token': token,
                  'partner_name': partner,
                  'page': page,
                  'limit': limit,
              }
              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode('utf-8'),
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(req, timeout=45) as res:
                  return json.loads(res.read().decode('utf-8'))

          def rows(data):
              if isinstance(data, list):
                  return [x for x in data if isinstance(x, dict)]
              if isinstance(data, dict):
                  for key in ('data','products','items','result','list'):
                      value = data.get(key)
                      if isinstance(value, list):
                          return [x for x in value if isinstance(x, dict)]
                      if isinstance(value, dict):
                          for nested in ('data','products','items','list'):
                              v = value.get(nested)
                              if isinstance(v, list):
                                  return [x for x in v if isinstance(x, dict)]
              return []

          def extract_urls(row):
              urls = []
              raw = row.get('imagename')
              if isinstance(raw, str) and raw.strip():
                  try:
                      raw = json.loads(raw)
                  except Exception:
                      raw = []
              if isinstance(raw, list):
                  for item in raw:
                      if isinstance(item, str) and item.strip():
                          urls.append(item.strip())
                      elif isinstance(item, dict):
                          for key in ('imgSrc','url','src'):
                              if item.get(key):
                                  urls.append(str(item[key]).strip())
                                  break
              default = row.get('default_image')
              if default:
                  urls.insert(0, str(default).strip())
              out = []
              for url in urls:
                  if url and url not in out:
                      out.append(url)
              return out

          def probe_url(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
                      'User-Agent': 'CunChic-Abit-CI/1.0',
                  },
                  method='GET',
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as res:
                      body = res.read(256 * 1024)
                      return {
                          'ok': True,
                          'status': res.status,
                          'final_url': res.geturl(),
                          'content_type': res.headers.get('Content-Type'),
                          'content_length': res.headers.get('Content-Length'),
                          'bytes_read': len(body),
                          'magic_hex': body[:16].hex(),
                      }
              except Exception as exc:
                  return {'ok': False, 'error': type(exc).__name__ + ': ' + str(exc)}

          counts = {
              'active_rows_checked': 0,
              'imagename_nonempty': 0,
              'default_image_nonempty': 0,
              'both_empty': 0,
              'description_nonempty': 0,
              'description_has_newline': 0,
              'description_has_br': 0,
              'description_has_p': 0,
              'short_description_nonempty': 0,
              'short_description_has_newline': 0,
              'short_description_has_br': 0,
              'short_description_has_p': 0,
          }
          image_samples = []
          description_samples = []
          image_urls_for_network = []

          for page in range(0, 27):
              batch = rows(post(page))
              for row in batch:
                  if str(row.get('status')) != '1':
                      continue
                  counts['active_rows_checked'] += 1
                  imagename = row.get('imagename')
                  default_image = row.get('default_image')
                  if imagename not in (None, '', [], {}): counts['imagename_nonempty'] += 1
                  if default_image not in (None, '', [], {}): counts['default_image_nonempty'] += 1
                  if imagename in (None, '', [], {}) and default_image in (None, '', [], {}): counts['both_empty'] += 1

                  desc = '' if row.get('description') is None else str(row.get('description'))
                  short = '' if row.get('short_description') is None else str(row.get('short_description'))
                  if desc.strip(): counts['description_nonempty'] += 1
                  if '\n' in desc or '\r' in desc: counts['description_has_newline'] += 1
                  if '<br' in desc.lower(): counts['description_has_br'] += 1
                  if '<p' in desc.lower(): counts['description_has_p'] += 1
                  if short.strip(): counts['short_description_nonempty'] += 1
                  if '\n' in short or '\r' in short: counts['short_description_has_newline'] += 1
                  if '<br' in short.lower(): counts['short_description_has_br'] += 1
                  if '<p' in short.lower(): counts['short_description_has_p'] += 1

                  urls = extract_urls(row)
                  if len(image_samples) < 8 and urls:
                      image_samples.append({
                          'productid': row.get('productid'),
                          'productcode': row.get('productcode'),
                          'url_count': len(urls),
                          'first_url': urls[0],
                      })
                  for url in urls:
                      if url not in image_urls_for_network and len(image_urls_for_network) < 3:
                          image_urls_for_network.append(url)

                  if len(description_samples) < 8 and (desc.strip() or short.strip()):
                      description_samples.append({
                          'productid': row.get('productid'),
                          'productcode': row.get('productcode'),
                          'description_len': len(desc),
                          'description_preview_repr': repr(desc[:350]),
                          'short_description_len': len(short),
                          'short_description_preview_repr': repr(short[:350]),
                      })
              if len(batch) < 100:
                  break

          network = [{'url': url, 'probe': probe_url(url)} for url in image_urls_for_network]
          result = {
              'counts': counts,
              'image_samples': image_samples,
              'network_probe': network,
              'description_samples': description_samples,
          }
          with open('abit-image-probe.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          print('PROBE_SUMMARY=' + json.dumps({'counts': counts, 'network_probe': network}, ensure_ascii=False))
          print('DESCRIPTION_SAMPLES=' + json.dumps(description_samples, ensure_ascii=False))
          PY

      - name: Upload image probe
        uses: actions/upload-artifact@v4
        with:
          name: abit-image-probe
          path: abit-image-probe.json
          retention-days: 7
